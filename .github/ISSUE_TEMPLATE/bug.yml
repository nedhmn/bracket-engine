name: Bug
description: Something behaves differently from what the docs say
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Tag or commit
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Smallest input that shows it. Fixture data is ideal.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
